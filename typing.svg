<svg xmlns="http://www.w3.org/2000/svg" width="400" height="50">
  <style>
    .text {
      font-family: 'JetBrains Mono', monospace, sans-serif;
      font-size: 1.75em;
      font-weight: 700;
      fill: #A78BFA;
      opacity: 0;
      animation: fadeSlide 12s infinite;
    }
    .role1 { animation-delay: 0s; }
    .role2 { animation-delay: 3s; }
    .role3 { animation-delay: 6s; }
    .role4 { animation-delay: 9s; }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(10px); }
      5%, 20% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-10px); }
    }
  </style>
  
  <g transform="translate(0, 35)">
    <text class="text role1">Full Stack Developer</text>
    <text class="text role2">Software Engineer</text>
    <text class="text role3">Open Source Contributor</text>
    <text class="text role4">Problem Solver</text>
  </g>
</svg>
